# =====================================================
#  硬件参数（roofline 代价 / cache 阈值）— 按设备组织
#
#  生成 cg / pyg 时传入设备名, 读取对应设备参数
#  peak_flops 按精度给出, 稠密口径: fp32=CUDA core, fp16/int8=tensor core
#  按 FP32 accumulate（cuDNN/TensorRT 默认, 可真实达到）; 厂商表的
#  FP16-acc/稀疏 峰值不采用, Pascal 等无 tensor core 的按硬件实际速率
#  RIDGE = peak_flops / peak_bytes 派生, 不入 yaml
#
#  设备命名与 bench 数据集一致:
#    seer_v2 / 默认     rtx3090
#    cmu_v1_fp32        cm4 cm7   (STM32H747XI: Cortex-M4 / Cortex-M7)
#    cmu_v2_fp32        cm7
#    cmu_v2_wh32_fp32   cm7       (同上, 输入 32x32)
#    hwnasbench         edgegpu raspi4 pixel3 eyeriss fpga
#    latbench           desktop-* embedded-* mobile-*
#    nasbench101        p100
#    nnmeter            cortexa76 adreno640 adreno630 myriadvpu
#    hwgptbench         P100 a100 h100 v100 a40 rtx2080 rtx3080
#                       a6000 cpu_xeon_* cpu_amd_*
#
#  标注「估算」的参数为量级近似, 可按需修正
# =====================================================

default_device: rtx3090
default_dtype: fp32

devices:
  # ── 本组设备 ──────────────────────────────────────
  rtx3090:
    peak_flops: {fp32: 35.6e+12, fp16: 71.2e+12, int8: 142.4e+12}  # FP32-acc 稠密 (FP16-acc 142, sparse 284 不采用)
    peak_bytes: 0.936e+12
    l2_bytes: 6291456        # 6 MB
    l1_bytes: 131072         # 128 KB / SM

  rtx3080:                     # hwgptbench 实测为 3080Ti, 按其参数
